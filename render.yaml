# Render Blueprint: in Render, choose New > Blueprint and point it at this repository.
# Creates one web service with HTTPS and a persistent disk for the database and videos.
services:
  - type: web
    name: diamondiq
    runtime: docker
    plan: starter            # a paid plan is required for a persistent disk
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: diamondiq-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DIAMONDIQ_SECURE_COOKIES
        value: "1"
      # Optional: set these to create the first admin automatically instead of using the setup code.
      - key: DIAMONDIQ_ADMIN_EMAIL
        sync: false
      - key: DIAMONDIQ_ADMIN_PASSWORD
        sync: false
