[project]
name = "diamondiq"
version = "0.1.0"
description = "Player evaluation, biomechanics, scouting, tracking and projection for every level of baseball."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
video = ["mediapipe>=0.10.14", "opencv-python-headless>=4.9"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["diamondiq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
